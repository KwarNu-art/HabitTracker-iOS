name: Build HabitTracker IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Unsigned App
        run: |
          xcodebuild \
            -project HabitTracker.xcodeproj \
            -scheme HabitTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HabitTracker.app Payload/
          zip -r -9 HabitTracker_TrollStore.ipa Payload
          rm -rf Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-IPA
          path: HabitTracker_TrollStore.ipa
